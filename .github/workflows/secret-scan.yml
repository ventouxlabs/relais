name: secret-scan

on:
  push:
    branches: [main] # feature branches are covered by their PRs (avoids duplicate runs)
  pull_request:

permissions:
  contents: read

jobs:
  # Runs the gitleaks CLI directly instead of gitleaks/gitleaks-action@v2.
  #
  # WHY, so nobody "simplifies" this back to the action: gitleaks-action refuses to run for
  # ORGANIZATION-owned repos without a paid GITLEAKS_LICENSE secret ("[org] is an organization.
  # License key is required."). It ran free for years under the personal account and broke the
  # instant this repo moved to the `ventouxlabs` org — turning a REQUIRED check permanently red and
  # blocking every PR, with no secret involved.
  #
  # The gitleaks TOOL itself is MIT-licensed and free; only the Action wrapper is commercial. Running
  # the release binary keeps identical scanning, identical config, and no licence.
  #
  # The job id must stay `gitleaks` — branch protection on `main` requires a check by that exact name.
  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so historical commits are scanned too
      - name: install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL --retry 3 "$url" | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: gitleaks
        # `git` scans full history — the 8.x replacement for the removed `detect` subcommand.
        # --redact keeps any finding's value out of the public log.
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .

  trufflehog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: trufflehog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified
